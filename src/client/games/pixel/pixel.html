<div class="game fit pixel">

    <header class="game-head">
        <div class="game-head-title">
            <span class="eyebrow" data-ref="playlist">Portada pixelada</span>
            <h1 class="display">Pixelada</h1>
        </div>
        <div class="stats">
            <div class="stat"><span>Puntos</span><strong data-ref="score">0</strong></div>
            <div class="stat"><span>Racha</span><strong data-ref="streak">0</strong></div>
            <div class="stat"><span>Récord</span><strong data-ref="best">0</strong></div>
        </div>
        <button class="btn btn-outline" type="button" data-exit>Salir</button>
    </header>

    <section data-ref="board" class="solo-board" aria-label="Partida">
        <div data-ref="stages" class="solo-stages" aria-hidden="true"></div>
        <canvas data-ref="canvas" class="pixel-canvas" width="320" height="320" role="img" aria-label="Portada pixelada"></canvas>
        <p data-ref="status" class="solo-status" role="status">¿De qué artista es esta portada?</p>
        <div data-ref="search" class="song-search"></div>
        <div class="solo-actions">
            <button data-ref="skip" class="btn btn-outline" type="button">Más nítida</button>
        </div>
        <ol data-ref="attempts" class="solo-attempts" aria-label="Intentos"></ol>
    </section>

    <section data-ref="reveal" class="solo-reveal hidden" aria-live="polite">
        <img data-ref="cover" alt="">
        <span data-ref="verdict" class="eyebrow"></span>
        <h2 data-ref="title" class="display"></h2>
        <p data-ref="artist" class="muted"></p>
        <button data-ref="next" class="btn btn-lg" type="button">Siguiente</button>
    </section>

</div>
