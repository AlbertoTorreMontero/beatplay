<div class="game fit pairs">

    <header class="game-head">
        <div class="game-head-title">
            <span class="eyebrow" data-ref="playlist">Parejas sonoras</span>
            <h1 class="display">Parejas</h1>
        </div>
        <div class="stats">
            <div class="stat"><span>Intentos</span><strong data-ref="moves">0</strong></div>
            <div class="stat"><span>Parejas</span><strong data-ref="found">0</strong></div>
            <div class="stat"><span>Récord</span><strong data-ref="best">—</strong></div>
        </div>
        <button class="btn btn-outline" type="button" data-exit>Salir</button>
    </header>

    <section data-ref="board" class="solo-board" aria-label="Partida">
        <div class="solo-modes">
            <div class="segmented" role="group" aria-label="Dificultad">
                <button type="button" data-mode="easy" aria-pressed="false">Fácil: con portadas</button>
                <button type="button" data-mode="normal" aria-pressed="true">Normal: solo oído</button>
            </div>
        </div>
        <div data-ref="grid" class="pairs-grid" aria-label="Cartas"></div>
        <p data-ref="status" class="solo-status" role="status">Preparando las cartas…</p>
    </section>

    <section data-ref="reveal" class="solo-reveal hidden" aria-live="polite">
        <span class="eyebrow">¡Todas las parejas!</span>
        <h2 class="display"><span data-ref="final">0</span> intentos</h2>
        <p data-ref="record" class="muted"></p>
        <button data-ref="again" class="btn btn-lg" type="button">Otra partida</button>
    </section>

</div>
