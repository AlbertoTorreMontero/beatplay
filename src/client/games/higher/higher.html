<div class="game fit higher">

    <header class="game-head">
        <div class="game-head-title">
            <span class="eyebrow" data-ref="playlist">Más o menos</span>
            <h1 class="display">Más o menos</h1>
        </div>
        <div class="stats">
            <div class="stat"><span>Racha</span><strong data-ref="streak">0</strong></div>
            <div class="stat"><span>Récord</span><strong data-ref="best">0</strong></div>
        </div>
        <button class="btn btn-outline" type="button" data-exit>Salir</button>
    </header>

    <section data-ref="board" class="solo-board" aria-label="Partida">
        <p data-ref="question" class="hl-question">¿Es más nueva o más antigua?</p>
        <div data-ref="arena" class="hl-arena"></div>
        <div data-ref="buttons" class="hl-buttons">
            <button data-answer="up" data-ref="up" class="btn btn-lg" type="button">▲ Más nueva</button>
            <button data-answer="down" data-ref="down" class="btn btn-lg btn-outline" type="button">▼ Más antigua</button>
        </div>
        <p data-ref="status" class="solo-status" role="status"></p>
    </section>

    <section data-ref="reveal" class="solo-reveal hidden" aria-live="polite">
        <span class="eyebrow">Fin de la racha</span>
        <h2 class="display"><span data-ref="final">0</span> seguidas</h2>
        <p data-ref="record" class="muted"></p>
        <button data-ref="again" class="btn btn-lg" type="button">Otra racha</button>
    </section>

</div>
